# Minimal Cloud Build config to run acct-setup.sh
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _PROJECT_ID: ""
  _BILLING_ACCOUNT: ""

steps:
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - -c
      - |
        echo "Inputs: PROJECT_ID=${_PROJECT_ID} BILLING_ACCOUNT=${_BILLING_ACCOUNT}"
        if [[ -z "${_PROJECT_ID}" || -z "${_BILLING_ACCOUNT}" ]]; then
          echo "ERROR: _PROJECT_ID and _BILLING_ACCOUNT required" >&2
          exit 1
        fi

  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - -c
      - |
        chmod +x ./bootstrap.sh
        ./acct-setup.sh "${_PROJECT_ID}" "${_BILLING_ACCOUNT}"

timeout: "1200s"
